name: CI
on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (backend v1)
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend/v1
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:v1.0.0

      - name: Build and push image (backend v2)
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend/v2
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:v2.0.0

      - name: Build and push image (frontend v1)
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:v1.0.0

      - name: Start the kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: 'test-cluster'

      - name: Load images into the kind cluster
        run: |
          docker pull ghcr.io/${{ github.repository }}/backend:v1.0.0
          docker pull ghcr.io/${{ github.repository }}/backend:v2.0.0
          docker pull ghcr.io/${{ github.repository }}/frontend:v1.0.0
          docker pull docker.io/library/postgres:17-alpine
          
          kind load docker-image ghcr.io/${{ github.repository }}/backend:v1.0.0 --name test-cluster
          kind load docker-image ghcr.io/${{ github.repository }}/backend:v2.0.0 --name test-cluster
          kind load docker-image ghcr.io/${{ github.repository }}/frontend:v1.0.0 --name test-cluster
          kind load docker-image docker.io/library/postgres:17-alpine --name test-cluster

      - name: Deploy the system
        run: |
          kubectl apply -f k8s/utils/nginx-ingress-controller.yaml
          kubectl apply -f k8s/postgres/
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/ingress/

      - name: Wait for the Pods to be ready
        run: |
          kubectl rollout status deployment/postgres-deployment --timeout=120s
          kubectl rollout status deployment/backend-blue --timeout=120s
          kubectl rollout status deployment/backend-green --timeout=120s
          kubectl rollout status deployment/frontend-deployment --timeout=120s
          kubectl rollout status deployment/ingress-nginx-controller -n ingress-nginx --timeout=120s

      - name: HTTP tests
        run: |
          kubectl port-forward deployment/ingress-nginx-controller -n ingress-nginx 8080:80 & sleep 5
          curl --fail http://localhost:8080/api/health
          kubectl patch service backend-service -p '{"spec":{"selector":{"version":"green"}}}'
          sleep 5
          curl --fail http://localhost:8080/api/health
          curl --fail http://localhost:8080/health
